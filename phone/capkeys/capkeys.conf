# Installed as /etc/capkeys.conf (never overwritten by install.sh). Restart after editing:
#   sudo systemctl restart capkeys

# Substring of the touchscreen name in /proc/bus/input/devices
device_name = "generic ft5x06"
# The screen ends at this Y; touches below it are the buttons
screen_max_y = 1919
# Seconds; repeated presses of one button are ignored (the controller bounces)
debounce = 0.3

# Buttons by X of the touch (left 200, middle 500, right 800). `keys` are pressed together:
# names from KEYS in capkeys.py (ESC, TAB, A, LEFT, LEFTALT, LEFTMETA, BACK, ...) or numeric key codes.
[[buttons]]
max_x = 350
keys = ["LEFTMETA", "A"]    # list of all apps

[[buttons]]
max_x = 650
keys = ["LEFTMETA"]         # overview (home)

[[buttons]]
max_x = 9999
keys = ["LEFTALT", "LEFT"]  # back
